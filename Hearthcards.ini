; Hearthcards settings. Changes take effect the next time the game starts.

[General]
; 1 = a copy of a card you already have (in your inventory, pinned to a poster, or rolled up with one)
;     never stays in your inventory, and cards you own stop showing up in loot.
bNoDuplicates=1
; 1 = extra detail in Documents\My Games\Skyrim Special Edition\SKSE\Hearthcards.log
bDebugLog=0

[Loot]
; Bandit, draugr, falmer, Forsworn, warlock, vampire and Thalmor corpses and chests, and citizens' pockets.
bLoot=1
; % chance per corpse / chest / pocket (on top of the vanilla list's own chance).
iLootChance=10
; Drawers and end tables (the misc-item roll that gives tankards, bowls, paper rolls...).
bDrawers=1
; % when that roll lands on a card (it lands on one about 1 time in 11).
iDrawerChance=100
; General goods merchants' misc stock.
bMerchants=1
; % when a stock roll lands on a card (about 1 time in 15).
iMerchantChance=100

[Poster]
; How far from you a poster can be hung, in game units (about 70 units = 1 metre).
fReach=350
